version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4.7
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=teamfemr
      - MYSQL_USER=sail
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  storage:
  mysql_data:
